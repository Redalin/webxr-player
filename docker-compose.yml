services:
  webxr-player:
    build: .
    container_name: 3dPlayer
    ports:
      - "8000:8000"  # HTTP Auto-Redirect Port
      - "8443:8443"  # HTTPS WebXR Streaming Port
    volumes:
      # Default media directory mounted inside container (accessible at both /media and /app/media)
      - /media/vrfiles:/media:z
    environment:
      - MEDIA_DIR=/media
      - HTTP_PORT=8000
      - HTTPS_PORT=8443
    restart: unless-stopped
