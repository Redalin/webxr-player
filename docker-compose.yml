services:
  webxr-player:
    build: .
    container_name: 3dPlayer
    ports:
      - "${HTTP_PORT:-8000}:8000"   # HTTP Auto-Redirect Port
      - "${HTTPS_PORT:-8443}:8443" # HTTPS WebXR Streaming Port
    volumes:
      # Host media directory volume mount (configured via HOST_MEDIA_DIR, default: /media/vrfiles)
      - ${HOST_MEDIA_DIR:-/media/vrfiles}:/media:z
      - ${HOST_MEDIA_DIR:-/media/vrfiles}:/app/media:z
    environment:
      - MEDIA_DIR=/media
      - HTTP_PORT=${HTTP_PORT:-8000}
      - HTTPS_PORT=${HTTPS_PORT:-8443}
    restart: unless-stopped
